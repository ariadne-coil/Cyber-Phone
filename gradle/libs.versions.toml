[versions]
#jetbrains
geocoderVersion = "3.41"
carrierVersion = "2.41"
kotlin = "2.4.21"
kotlinxSerializationJson = "1.11.0"
#KSP
ksp = "2.3.12"
#Detekt
detekt = "1.23.8"
# Rules 0.5+ require prerelease Detekt 2; this is the latest compatible stable version.
detektCompose = "0.4.28"
#AndroidX
androidx-appcompat = "1.8.0"
androidx-constraintlayout = "2.2.2"
androidx-swiperefreshlayout = "1.2.0"
androidx-lifecycleprocess = "2.11.0"
androidx-documentfile = "1.1.0"
androidx-webkit = "1.17.1"
#Eventbus
eventbus = "3.3.1"
#Room
room = "2.8.5"
#Commons stack
commons = "7.1.1"
commons-compress = "1.28.0"
mmslib = "1.0.0"
indicator-fast-scroll = "c7873f7168"
#Gradle
gradlePlugins-agp = "9.4.1"
#Helpers
ez-vcard = "0.12.2"
#Other
autofitTextView = "0.2.1"
libphonenumberVersion = "9.0.41"
libphonenumberinfo = "c77bdd2b69"
mediapipeTasksTextVersion = "1.1.0"
okhttp = "5.5.0"
slf4j = "1.7.36"
work = "2.12.0"
bouncycastle = "1.86"
msgpack = "0.9.12"
zxingCore = "3.5.4"
zxingEmbedded = "4.3.0"
concentus = "3885c4e465"
junit = "4.13.2"
robolectric = "4.17"
ldkNode = "0.7.0"
#build
app-build-compileSDKVersion = "37"
app-build-compileSDKMinorVersion = "2"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
#AndroidX
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycleprocess" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidx-swiperefreshlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
#Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Commons stack
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
indicator-fast-scroll = { module = "org.fossify:IndicatorFastScroll", version.ref = "indicator-fast-scroll" }
mmslib = { module = "org.fossify:mmslib", version.ref = "mmslib" }
#EventBus
eventbus = { module = "org.greenrobot:eventbus", version.ref = "eventbus" }
#Kotlin
geocoder = { module = "com.googlecode.libphonenumber:geocoder", version.ref = "geocoderVersion" }
carrier = { module = "com.googlecode.libphonenumber:carrier", version.ref = "carrierVersion" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
#Helpers
ez-vcard = { module = "com.googlecode.ez-vcard:ez-vcard", version.ref = "ez-vcard" }
#Other
autofit-text-view = { module = "me.grantland:autofittextview", version.ref = "autofitTextView" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumberVersion" }
libphonenumberinfo = { module = "com.gitlab.xynngh:LibPhoneNumberInfo", version.ref = "libphonenumberinfo" }
mediapipe-tasks-text = { module = "com.google.mediapipe:tasks-text", version.ref = "mediapipeTasksTextVersion" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
slf4j-android = { module = "org.slf4j:slf4j-android", version.ref = "slf4j" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
msgpack-core = { module = "org.msgpack:msgpack-core", version.ref = "msgpack" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
concentus = { module = "com.github.lostromb.Concentus:Concentus", version.ref = "concentus" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
ldk-node-android = { module = "org.lightningdevkit:ldk-node-android", version.ref = "ldkNode" }

[bundles]
room = [
    "androidx-room-ktx",
    "androidx-room-runtime",
]

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
androidLibrary = { id = "com.android.library", version.ref = "gradlePlugins-agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
