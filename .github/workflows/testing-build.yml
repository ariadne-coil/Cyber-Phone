name: Testing build (on PR)

on:
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]
    paths-ignore:
      - ".github/**"
      - "CHANGELOG.md"
      - "docs/**"
      - "fastlane/**"
      - "LICENSE"
      - "README.md"

jobs:
  testing-build:
    name: Build debug artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android and wallet build tools
        uses: ./.github/actions/setup-build-tools

      - name: Assemble debug builds
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :messages:assembleDebug :app:assembleDebug
