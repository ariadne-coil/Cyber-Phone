name: Fastlane metadata validation

on:
  push:
    branches: [main]
    paths:
      - "fastlane/**"
  pull_request:
    branches: [main]
    paths:
      - "fastlane/**"

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required metadata files
        run: |
          set -euo pipefail
          BASE="fastlane/metadata/android/en-US"

          for f in title.txt short_description.txt full_description.txt; do
            if [ ! -s "$BASE/$f" ]; then
              echo "::error::Missing required file: $BASE/$f"
              exit 1
            fi
          done

          VERSION_CODE=$(grep -E '^VERSION_CODE=' gradle.properties | cut -d'=' -f2-)
          CHANGELOG_FILE="$BASE/changelogs/${VERSION_CODE}.txt"
          if [ ! -s "$CHANGELOG_FILE" ]; then
            echo "::error::Missing changelog for VERSION_CODE=$VERSION_CODE at $CHANGELOG_FILE"
            exit 1
          fi

      - name: Validate banned upstream/store links are absent
        run: |
          set -euo pipefail
          if rg -n --hidden --glob '*.txt' \
            "play\.google\.com/store/apps/details\?id=org\.fossify\.thankyou|fossify\.org/upgrade_to_pro|FossifyOrg/General-Discussion|FossifyOrg/general-Discussion" \
            fastlane/metadata/android; then
            echo "::error::Found banned upstream/store links in fastlane metadata"
            exit 1
          fi

      - name: Publish summary
        run: |
          {
            echo "### Fastlane metadata validation"
            echo "- Package ID: \\`org.cyberphone\\`"
            echo "- Required en-US metadata files are present"
            echo "- Changelog exists for current VERSION_CODE"
            echo "- Banned upstream/store links were not detected"
          } >> "$GITHUB_STEP_SUMMARY"
