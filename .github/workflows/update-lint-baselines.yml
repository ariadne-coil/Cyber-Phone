name: Update lint baselines

on:
  repository_dispatch:
    types: [update-lint-baselines]
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  update-lint-baselines:
    name: Refresh lint/detekt baselines
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Regenerate baselines
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:updateLintBaseline \
            :messages:updateLintBaseline \
            :app:detektBaseline \
            :messages:detektBaseline

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ci/update-lint-baselines
          commit-message: "chore(ci): update lint and detekt baselines"
          title: "chore(ci): update lint and detekt baselines"
          body: |
            Automated baseline refresh.

            Files updated:
            - app/lint-baseline.xml
            - messages/lint-baseline.xml
            - app/detekt-baseline.xml
            - messages/detekt-baseline.xml
          labels: |
            ci
            maintenance
          add-paths: |
            app/lint-baseline.xml
            messages/lint-baseline.xml
            app/detekt-baseline.xml
            messages/detekt-baseline.xml
