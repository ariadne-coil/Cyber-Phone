name: PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "CHANGELOG.md"
      - "docs/**"
      - "fastlane/**"
      - "LICENSE"
      - "README.md"

jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run detekt (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:detekt \
            :messages:detekt

      - name: Run lint and unit tests (blocking)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :app:lintDebug \
            :messages:lintDebug \
            :app:testDebugUnitTest \
            :messages:testDebugUnitTest
