name: Bug report
description: Report a reproducible bug in Cyber Phone
labels: [ "bug", "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Hi there 👋
        Thanks for helping improve Cyber Phone.
        Please provide a clear, reproducible report with concrete steps.

        Security note:
        - Do **not** share private keys, seed phrases, wallet backup payloads, or full personal contact data.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I can reproduce this on the latest release from https://github.com/ariadne-coil/Cyber-Phone/releases/latest
          required: true
        - label: I searched existing open/closed issues and discussions before filing
          required: true
        - label: This report contains exactly one bug
          required: true
        - label: I removed or redacted sensitive/private information from logs and screenshots
          required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Calls / Dialer
        - Messages / SMS / MMS
        - Mesh messaging
        - Mesh calls
        - Wallet (Bitcoin Mainnet / Lightning)
        - Wallet (Fedimint)
        - Contacts
        - Cyber Features settings
        - UI / Theme / Fonts
        - Backup / Restore
        - Install / Update
        - Other
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Install source
      options:
        - F-Droid
        - GitHub release APK
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Affected app version
      placeholder: "Example: 0.5.2"
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android / ROM version
      placeholder: "Example: Android 14 / One UI 6.1"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      placeholder: "Example: Pixel 8 Pro / Galaxy S23"
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: Include exact steps and timing.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Wait ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment_details
    attributes:
      label: Relevant runtime details (if applicable)
      description: |
        Include only what applies:
        - Wallet: selected federation, balance state, send/receive/sync action
        - Mesh: mesh mode, active interfaces (BLE / Wi-Fi Direct / Wi-Fi Aware), routing setting
        - Calls/Messages: SIM setup, default apps, permission state
      placeholder: |
        Federation: Bitcoin Mainnet
        Mesh mode: Mesh with fallback
        Interfaces: Wi-Fi Aware ON, BLE OFF, Wi-Fi Direct ON

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace / screenshots
      description: Paste relevant redacted logcat excerpt and attach screenshots if possible.
      placeholder: |
        - Timestamp:
        - Exception:
        - Top stack frames:
