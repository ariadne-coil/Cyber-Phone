name: Feature request
description: Suggest a Cyber Phone feature or enhancement
labels: [ "feature request", "needs triage" ]
body:
  - type: markdown
    attributes:
      value: |
        ## Hi there 👋
        Thanks for suggesting improvements for Cyber Phone.
        Please submit one focused request with clear user impact.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing open/closed issues and discussions before filing
          required: true
        - label: This issue contains exactly one feature request
          required: true
        - label: I can explain who this helps and why current behavior is insufficient
          required: true
        - label: I understand this project is privacy-first and offline/mesh-capable by design
          required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Calls / Dialer
        - Messages / SMS / MMS
        - Mesh messaging
        - Mesh calls
        - Wallet (Bitcoin Mainnet / Lightning)
        - Wallet (Fedimint)
        - Contacts
        - Cyber Features settings
        - UI / Theme / Fonts
        - Backup / Restore
        - Security / Privacy
        - Developer tooling / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: |
        Current behavior:
        Why it is a problem:
        Who is affected:
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you want, including UX details if relevant.
      placeholder: |
        Desired behavior:
        Entry points/screens:
        Any constraints:
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives considered
      description: List any workaround or alternative designs you considered.

  - type: textarea
    id: impact_and_tradeoffs
    attributes:
      label: Impact and trade-offs
      description: |
        Note expected impact on:
        - usability
        - privacy/security
        - battery/network usage
        - compatibility (Android versions/devices)

  - type: textarea
    id: additional_information
    attributes:
      label: Additional information
      description: Include mockups, sketches, references, or implementation notes if useful.
